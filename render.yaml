databases:
  - name: signal-clone-db
    databaseName: signal_clone
    user: signal_clone_user
    plan: free

services:
  - type: web
    name: signal-clone-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: signal-clone-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        value: '["https://your-frontend.vercel.app","http://localhost:3000"]'
      - key: DEBUG
        value: "false"
    healthCheckPath: /health
